spring.application.name=enquiry.system

spring.datasource.url=jdbc:mysql://localhost:3306/Project2k25
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jap.show-sql=true;

# HikariCP settings
# Maintain at least 5 idle connections
spring.datasource.hikari.minimum-idle=5
# Allow up to 20 simultaneous connections            
spring.datasource.hikari.maximum-pool-size=20   
# Wait up to 30 seconds to obtain a connection     
spring.datasource.hikari.connection-timeout=30000   
# Connections idle for 10 minutes may be removed  
spring.datasource.hikari.idle-timeout=600000      
# Enable auto-commit, or disable if you are managing transactions manually    
spring.datasource.hikari.auto-commit=true            